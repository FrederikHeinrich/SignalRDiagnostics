name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            short_sha="${GITHUB_SHA::12}"
            version="$(date -u +'%Y.%-m.%-d-b%H%M%S')${short_sha}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "BUILD_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish portable build
        run: dotnet publish --configuration Release --no-build --output ./publish/portable

      - name: Publish Windows self-contained build
        run: >
          dotnet publish
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./publish/win-x64-self-contained
          /p:PublishSingleFile=false

      - name: Package publish output
        shell: bash
        run: |
          mkdir -p artifacts
          cd publish/portable
          zip -r "../../artifacts/SignalRDiagnostics-portable-${BUILD_VERSION}.zip" .
          cd ../win-x64-self-contained
          zip -r "../../artifacts/SignalRDiagnostics-win-x64-self-contained-${BUILD_VERSION}.zip" .

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: SignalRDiagnostics-${{ steps.version.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v8
        with:
          name: SignalRDiagnostics-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Create or update release
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/*.zip --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SignalRDiagnostics ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
